name: Weekly data refresh

# Sunday 9:00 AM Eastern (14:00 UTC in winter, 10 AM during daylight time), plus a "Run workflow" button.
on:
  schedule:
    - cron: '0 14 * * 0'
  workflow_dispatch:
    inputs:
      full:
        description: 'Re-fetch everything, rosters and coaches included (~150 CFBD calls)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Keeps roster and coach responses between runs so a weekly run only spends ~10 CFBD calls.
      - uses: actions/cache@v4
        with:
          path: scripts/.cache
          key: cfbd-cache-${{ github.run_id }}
          restore-keys: cfbd-cache-
      - name: Pull data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          OUT_DIR: site/v1
        run: node scripts/sync-data.mjs ${{ inputs.full && '--refresh' || '--weekly' }}
      - name: Index page
        run: |
          cp site/v1/meta.json site/meta.json
          echo '<!doctype html><title>hashmark-data</title><p>Data files for the Hashmark app. Not official; source: CollegeFootballData.com.</p>' > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
