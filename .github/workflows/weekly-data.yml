name: Weekly data refresh

# Data (scores, polls, stats...): Sunday 9:00 AM Eastern (14:00 UTC; 10 AM during daylight time).
# News: every 2 hours. News runs rebuild the data files from the cache and spend no CFBD calls.
on:
  schedule:
    - cron: '0 14 * * 0'
    - cron: '20 */2 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Re-fetch everything, rosters and coaches included (~150 CFBD calls)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Keeps CFBD responses between runs: weekly runs spend ~12 calls, news runs none.
      - uses: actions/cache@v4
        with:
          path: scripts/.cache
          key: cfbd-cache-${{ github.run_id }}
          restore-keys: cfbd-cache-
      - name: Pull data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          OUT_DIR: site/v1
          CACHE_ONLY: ${{ github.event.schedule == '20 */2 * * *' && '1' || '0' }}
        run: |
          if [ "${{ github.event.schedule }}" = "20 */2 * * *" ]; then node scripts/sync-data.mjs
          elif [ "${{ inputs.full }}" = "true" ]; then node scripts/sync-data.mjs --refresh
          else node scripts/sync-data.mjs --weekly; fi
      - name: Collect news
        env:
          OUT_DIR: site/v1
          NEWS_DUMP: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node scripts/sync-news.mjs
      - name: Index page
        run: |
          cp site/v1/meta.json site/meta.json
          echo '<!doctype html><title>hashmark-data</title><p>Data files for the Hashmark app. Not official; sources: CollegeFootballData.com and publisher RSS feeds.</p>' > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
